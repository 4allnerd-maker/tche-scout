<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tchê Scout · Geral — Ligas brasileiras</title>
<meta name="description" content="Classificação, estatísticas de times e ranking de jogadores das ligas brasileiras: Brasileirão, Copa do Brasil e estaduais.">
<link rel="icon" href="assets/logo.svg">
<link rel="stylesheet" href="assets/estilo.css">
</head>
<body>
<main>
  <h1>Ligas brasileiras</h1>
  <p class="sub" id="sub">Carregando…</p>
  <h2 class="sec">Nacionais</h2><div class="cards" id="nacionais"></div>
  <h2 class="sec">Estaduais</h2><div class="cards" id="estaduais"></div>
  <p class="aviso">Versão piloto, temporada 2026. As ligas pequenas têm estatísticas de times e jogos; o ranking de jogadores só existe onde a fonte traz dados de atletas.</p>
</main>
<script src="assets/comum.js"></script>
<script>
cabecalho("home");
const NAC = ["serie-a","serie-b","serie-c","serie-d","copa-do-brasil","supercopa-do-brasil"];
getJSON("dados/ligas.json").then(d => {
  $("sub").textContent = `${d.ligas.length} competições · dados de ${d.fonte} · atualizado em ${d.gerado_em}`;
  const card = l => `<div class="liga"><h3>${esc(l.nome)} ${l.temporada}</h3>
    <p>${l.times} times · ${l.jogos}/${l.jogos_total} jogos realizados</p>
    <div class="prog"><i style="width:${Math.round(100 * l.jogos / Math.max(1, l.jogos_total))}%"></i></div>
    <div class="links"><a href="liga.html?c=${l.chave}">Times e jogos</a>
    ${l.jogadores ? `<a href="jogadores.html?c=${l.chave}">Jogadores (${l.jogadores})</a>` : `<span class="tag">sem dados de jogadores</span>`}</div></div>`;
  const nac = d.ligas.filter(l => NAC.includes(l.id)), est = d.ligas.filter(l => !NAC.includes(l.id));
  $("nacionais").innerHTML = nac.map(card).join(""); $("estaduais").innerHTML = est.map(card).join("");
}).catch(() => $("sub").textContent = "Não foi possível carregar os dados. Rode geral/importar.py e abra o site por um servidor.");
</script>
</body>
</html>
