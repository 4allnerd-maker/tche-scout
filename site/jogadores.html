<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tchê Scout · Geral — Jogadores</title>
<meta name="description" content="Ranking e avaliação de jogadores das ligas brasileiras: gols, assistências, xG, xA, desarmes e mais, por posição e por 90 minutos.">
<link rel="icon" href="assets/logo.svg">
<link rel="stylesheet" href="assets/estilo.css">
</head>
<body>
<main>
  <h1>Jogadores</h1>
  <p class="sub" id="sub">Carregando dados…</p>
  <section class="filtros">
    <div><label for="fLiga">Liga / temporada</label><select id="fLiga"></select></div>
    <div><label for="fPos">Posição</label><select id="fPos"><option value="">Todas</option><option>Goleiro</option><option>Defensor</option><option>Meia</option><option>Atacante</option></select></div>
    <div><label for="fClube">Clube</label><select id="fClube"><option value="">Todos</option></select></div>
    <div><label for="fMin">Mínimo de minutos</label><input id="fMin" type="number" min="0" step="90" value="900"></div>
    <div><label for="fMetrica">Ranking por</label><select id="fMetrica"></select></div>
    <div><label for="fBusca">Buscar jogador</label><input id="fBusca" type="search" placeholder="Nome…"></div>
  </section>
  <section class="kpis" id="kpis"></section>
  <section class="painel"><h2 id="tituloTop">Top 10</h2><div id="top"></div><p class="aviso" id="avisoMetrica"></p></section>
  <section class="painel"><h2>Tabela de jogadores <span class="tag" id="contagem"></span></h2>
    <div class="tabela-wrap"><table id="tabela"><thead></thead><tbody></tbody></table></div>
    <p class="aviso">Clique no cabeçalho para ordenar e numa linha para ver a ficha do jogador. Métricas “por 90” só aparecem para quem tem 90 minutos ou mais.</p></section>
</main>
<dialog id="ficha" class="larga"><div id="fichaCorpo"></div><p style="text-align:right;margin:.5rem 0 0"><button onclick="$('ficha').close()">Fechar</button></p></dialog>
<script src="assets/config.js"></script>
<script src="assets/comum.js"></script>
<script src="assets/auth.js"></script>
<script src="assets/ficha.js"></script>
<script src="assets/card.js"></script>
<script>
cabecalho("jogadores");
const METRICAS = {
  gols:["Gols","int"], assist:["Assistências","int"], xg:["xG (gols esperados)","dec"], xa:["xA (assist. esperadas)","dec"],
  gols_90:["Gols por 90","dec"], assist_90:["Assistências por 90","dec"], xg_90:["xG por 90","dec"], xa_90:["xA por 90","dec"],
  chutes_90:["Chutes por 90","dec"], passes_chave_90:["Passes-chave por 90","dec"], desarmes_90:["Desarmes por 90","dec"],
  nota:["Nota média","dec"], min:["Minutos","int"], jogos:["Jogos","int"], amarelos:["Cartões amarelos","int"],
  defesas:["Defesas (goleiros)","int"], jogos_sem_sofrer:["Jogos sem sofrer gol","int"]
};
const AVANCADAS = ["xg","xa","xg_90","xa_90","nota","desarmes_90","chutes_90","passes_chave_90"];
const COLS = [["nome_curto","Jogador"],["clube","Clube"],["posicao","Pos."],["idade","Idade"],["classe","Cl."],["ovr","OVR"],["jogos","J"],["min","Min"],["gols","Gols"],["assist","Ass."],
  ["xg","xG"],["xa","xA"],["chutes","Chutes"],["passes_pct","Passes %"],["desarmes","Desarmes"],["nota","Nota"]];
let DADOS = [], INDICE = [], ordem = { campo: "gols", dir: -1 };

async function iniciar() {
  try { await exigirLogin(); INDICE = (await dados("ligas")).ligas.filter(l => l.jogadores > 0); }
  catch (e) { if (e.message !== "login") $("sub").textContent = e.message || "Não foi possível carregar os dados."; return; }
  const pedida = new URLSearchParams(location.search).get("c");
  $("fLiga").innerHTML = INDICE.map(l => `<option value="${l.chave}">${esc(l.nome)} ${l.temporada} (${l.jogadores})</option>`).join("");
  if (pedida && INDICE.some(l => l.chave === pedida)) $("fLiga").value = pedida;
  $("fMetrica").innerHTML = Object.entries(METRICAS).map(([k, [n]]) => `<option value="${k}">${n}</option>`).join("");
  ["fLiga","fPos","fClube","fMin","fMetrica","fBusca"].forEach(id => $(id).addEventListener(["fBusca","fMin"].includes(id) ? "input" : "change", async () => {
    if (id === "fLiga") { await carrega(); return; }
    if (id === "fMetrica") ordem = { campo: $("fMetrica").value, dir: -1 };
    desenha(); }));
  await carrega();
}
async function carrega() {
  const l = INDICE.find(x => x.chave === $("fLiga").value);
  try { DADOS = await dados(`jogadores/${l.chave}`); }
  catch (e) { if (e.message === "login") return; $("sub").innerHTML = ""; $("sub").insertAdjacentHTML("afterbegin", bannerPremium(e.premium ? "Esta liga é exclusiva do plano Premium." : esc(e.message))); DADOS = []; desenha(); return; }
  document.querySelectorAll(".banner-premium").forEach(b => b.remove());
  if (DADOS.limitado) $("sub").insertAdjacentHTML("afterend", bannerPremium(`Plano gratuito: mostrando ${DADOS.length} de ${DADOS.total.toLocaleString("pt-BR")} jogadores. Assine o Premium para ver todos.`));
  $("sub").textContent = `${l.nome} ${l.temporada} · ${DADOS.length.toLocaleString("pt-BR")} jogadores · dados de FootyStats`;
  $("fMin").value = Math.round(0.3 * Math.max(0, ...DADOS.map(j => j.min || 0)) / 90) * 90;
  const clubes = [...new Set(DADOS.map(j => j.clube).filter(Boolean))].sort((a, b) => a.localeCompare(b, "pt"));
  $("fClube").innerHTML = '<option value="">Todos</option>' + clubes.map(c => `<option>${esc(c)}</option>`).join("");
  desenha();
}
function filtrado() {
  const pos = $("fPos").value, clube = $("fClube").value, min = +$("fMin").value || 0, q = $("fBusca").value.trim().toLowerCase();
  return DADOS.filter(j => (!pos || j.posicao === pos) && (!clube || j.clube === clube) && (j.min || 0) >= min && (!q || j.nome.toLowerCase().includes(q) || (j.nome_curto || "").toLowerCase().includes(q)));
}
function desenha() {
  const lista = filtrado(), m = $("fMetrica").value, [nomeM, tipo] = METRICAS[m];
  const soma = k => lista.reduce((a, j) => a + (j[k] || 0), 0);
  $("kpis").innerHTML = [["Jogadores", lista.length], ["Gols", soma("gols")], ["Assistências", soma("assist")], ["Cartões amarelos", soma("amarelos")]]
    .map(([n, v]) => `<div class="kpi"><b>${v.toLocaleString("pt-BR")}</b><span>${n}</span></div>`).join("");
  const top = lista.filter(j => j[m] != null).sort((a, b) => b[m] - a[m]).slice(0, 10), max = top.length ? top[0][m] || 1 : 1;
  $("tituloTop").textContent = `Top 10 — ${nomeM}`;
  $("top").innerHTML = top.length ? top.map((j, i) => `<div class="barra" data-id="${j.id}"><span class="pos">${i + 1}</span>
    <span class="nome">${esc(j.nome_curto || j.nome)} <small>${esc(j.clube)} · ${esc(j.posicao)}</small></span>
    <span class="trilho"><i style="width:${Math.max(3, (j[m] / max) * 100)}%"></i></span><span class="val">${fmt(j[m], tipo)}</span></div>`).join("") : "<p class='aviso'>Nenhum jogador com esse filtro.</p>";
  const semAv = lista.filter(j => !j.tem_avancadas).length;
  $("avisoMetrica").textContent = semAv && AVANCADAS.includes(m) ? `${semAv} jogador(es) do filtro não têm estatísticas avançadas na fonte e ficam fora desse ranking.` : "";
  const campo = ordem.campo, ord = [...lista].sort((a, b) => { const x = a[campo], y = b[campo];
    if (x == null && y == null) return 0; if (x == null) return 1; if (y == null) return -1;
    return (typeof x === "string" ? x.localeCompare(y, "pt") : x - y) * ordem.dir; });
  $("contagem").textContent = `${ord.length} jogadores`;
  $("tabela").querySelector("thead").innerHTML = "<tr>" + COLS.map(([c, n]) => `<th data-c="${c}" class="${["nome_curto","clube","posicao"].includes(c) ? "l" : ""} ${c === campo ? "ord" : ""}">${n}${c === campo ? (ordem.dir < 0 ? " ↓" : " ↑") : ""}</th>`).join("") + "</tr>";
  $("tabela").querySelector("tbody").innerHTML = ord.slice(0, 300).map(j => `<tr data-id="${j.id}">` + COLS.map(([c]) => {
    const v = j[c]; if (c === "classe") return `<td>${selo(v)}</td>`; if (c === "ovr") return `<td style="color:${corNota(v)};font-weight:800">${v ?? "–"}</td>`;
    if (["nome_curto","clube","posicao"].includes(c)) return `<td class="l" title="${esc(j.nome)}">${esc(v)}</td>`;
    return `<td>${["xg","xa","nota"].includes(c) ? fmt(v, "dec") : (c === "passes_pct" ? (v == null ? "–" : Math.round(v) + "%") : fmt(v))}</td>`; }).join("") + "</tr>").join("");
  document.querySelectorAll("#tabela th").forEach(th => th.onclick = () => { const c = th.dataset.c;
    ordem = ordem.campo === c ? { campo: c, dir: -ordem.dir } : { campo: c, dir: typeof lista[0]?.[c] === "string" ? 1 : -1 }; desenha(); });
  document.querySelectorAll("[data-id]").forEach(el => el.onclick = () => ficha(el.dataset.id));
}
function ficha(id) { const j = DADOS.find(x => x.id === id); if (j) abrirFicha(j); }
iniciar();
</script>
</body>
</html>
