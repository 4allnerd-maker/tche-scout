<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tabela de atletas · Tchê Scout</title>
<link rel="icon" href="assets/logo.svg">
<link rel="stylesheet" href="assets/estilo.css">
</head>
<body>
<main>
  <h1 id="titulo">Tabela</h1>
  <p class="sub" id="sub">Carregando…</p>
  <section class="filtros">
    <div><label for="fLiga">Liga / temporada</label><select id="fLiga"></select></div>
    <div><label for="fPos">Posição</label><select id="fPos"><option value="">Todas</option><option>Goleiro</option><option>Defensor</option><option>Meia</option><option>Atacante</option></select></div>
    <div><label for="fClube">Clube</label><select id="fClube"><option value="">Todos</option></select></div>
    <div><label for="fMin">Mínimo de minutos</label><input id="fMin" type="number" min="0" step="90" value="450"></div>
    <div><label for="fBusca">Buscar jogador</label><input id="fBusca" type="search" placeholder="Nome…"></div>
  </section>
  <div class="abas" id="grupos"></div>
  <section class="painel">
    <h2><span id="rotulo"></span> <span class="tag" id="contagem"></span></h2>
    <div class="tabela-wrap"><table id="tabela"><thead></thead><tbody></tbody></table></div>
    <p class="aviso" id="nota"></p>
  </section>
</main>
<dialog id="ficha" class="larga"><div id="fichaCorpo"></div><p style="text-align:right;margin:.5rem 0 0"><button onclick="$('ficha').close()">Fechar</button></p></dialog>
<script src="assets/config.js"></script>
<script src="assets/comum.js"></script>
<script src="assets/auth.js"></script>
<script src="assets/ficha.js"></script>
<script>
const MODO = new URLSearchParams(location.search).get("modo") === "eta" ? "eta" : "vca";
cabecalho(MODO);
let DEF, DADOS = [], INDICE = [], GRUPO = null, ordem = { i: null, dir: -1, campo: "min" };
const TXT = {
  vca: ["VCA · Dados brutos", "Totais e porcentagens da temporada. Clique num atleta para abrir a ficha."],
  eta: ["ETA · Por 90 minutos", "Taxas por 90 minutos, com a posição do atleta entre os da mesma função (verde = melhor). Clique num atleta para abrir a ficha."],
};
$("titulo").textContent = TXT[MODO][0]; document.title = TXT[MODO][0] + " · Tchê Scout"; $("nota").textContent = TXT[MODO][1];

async function iniciar() {
  try { await exigirLogin(); DEF = (await colunasDef())[MODO]; INDICE = (await dados("ligas")).ligas.filter(l => l.jogadores > 0); }
  catch (e) { if (e.message !== "login") $("sub").textContent = e.message || "Não foi possível carregar os dados."; return; }
  const pedida = new URLSearchParams(location.search).get("c");
  $("fLiga").innerHTML = INDICE.map(l => `<option value="${l.chave}">${esc(l.nome)} ${l.temporada} (${l.jogadores})</option>`).join("");
  if (pedida && INDICE.some(l => l.chave === pedida)) $("fLiga").value = pedida;
  const gs = [...new Set(DEF.map(c => c.grupo))]; GRUPO = gs[0];
  $("grupos").innerHTML = gs.map(g => `<button data-g="${g}">${g}</button>`).join("") + `<button data-g="*">Todas as colunas</button>`;
  $("grupos").querySelectorAll("button").forEach(b => b.onclick = () => { GRUPO = b.dataset.g; ordem.i = null; desenha(); });
  ["fPos", "fClube", "fMin", "fBusca"].forEach(i => $(i).addEventListener(["fBusca", "fMin"].includes(i) ? "input" : "change", desenha));
  $("fLiga").addEventListener("change", carrega); await carrega();
}
async function carrega() {
  const l = INDICE.find(x => x.chave === $("fLiga").value);
  try { DADOS = await dados(`jogadores/${l.chave}`); }
  catch (e) { if (e.message === "login") return; $("sub").innerHTML = ""; $("sub").insertAdjacentHTML("afterbegin", bannerPremium(e.premium ? "Esta liga é exclusiva do plano Premium." : esc(e.message))); DADOS = []; desenha(); return; }
  document.querySelectorAll(".banner-premium").forEach(b => b.remove());
  $("sub").textContent = `${l.nome} ${l.temporada} · ${DADOS.length.toLocaleString("pt-BR")} atletas`;
  if (DADOS.limitado) $("sub").insertAdjacentHTML("afterend", bannerPremium(`Plano gratuito: mostrando ${DADOS.length} de ${DADOS.total.toLocaleString("pt-BR")} atletas. Assine o Premium para ver todos.`));
  $("fMin").value = Math.round(0.3 * Math.max(0, ...DADOS.map(j => j.min || 0)) / 90) * 90;
  const clubes = [...new Set(DADOS.map(j => j.clube).filter(Boolean))].sort((a, b) => a.localeCompare(b, "pt"));
  $("fClube").innerHTML = '<option value="">Todos</option>' + clubes.map(c => `<option>${esc(c)}</option>`).join(""); desenha();
}
function desenha() {
  const min = +$("fMin").value || 0, q = $("fBusca").value.trim().toLowerCase(), pos = $("fPos").value, clube = $("fClube").value;
  let lista = DADOS.filter(j => (!pos || j.posicao === pos) && (!clube || j.clube === clube) && (j.min || 0) >= min && (!q || j.nome.toLowerCase().includes(q) || (j.nome_curto || "").toLowerCase().includes(q)));
  const idx = DEF.map((c, i) => i).filter(i => GRUPO === "*" || DEF[i].grupo === GRUPO);
  $("grupos").querySelectorAll("button").forEach(b => b.classList.toggle("ativo", b.dataset.g === GRUPO));
  const arr = j => MODO === "vca" ? j.vca : j.eta;
  const val = (j, i) => i === null ? (j[ordem.campo] ?? null) : (arr(j) ? arr(j)[i] : null);
  lista = [...lista].sort((a, b) => { const x = val(a, ordem.i), y = val(b, ordem.i); if (x == null && y == null) return 0; if (x == null) return 1; if (y == null) return -1;
    return (typeof x === "string" ? x.localeCompare(y, "pt") : x - y) * ordem.dir; });
  $("rotulo").textContent = TXT[MODO][0]; $("contagem").textContent = lista.length + " atletas";
  $("tabela").querySelector("thead").innerHTML = "<tr><th class='l' data-c='nome_curto'>Atleta</th><th class='l' data-c='clube'>Clube</th><th class='l' data-c='posicao'>Pos.</th><th data-c='min'>Min</th>" +
    idx.map(i => `<th data-i="${i}" class="${ordem.i === i ? "ord" : ""}">${DEF[i].rotulo}${DEF[i].menos_melhor ? " ↓" : ""}</th>`).join("") + "</tr>";
  $("tabela").querySelector("tbody").innerHTML = lista.slice(0, 300).map((j, n) => `<tr data-id="${j.id}"><td class="l" title="${esc(j.nome)}">${esc(j.nome_curto || j.nome)}</td><td class="l">${esc(j.clube)}</td><td class="l">${esc(j.posicao.slice(0, 3))}</td><td>${fmt(j.min)}</td>` +
    idx.map(i => { const v = arr(j) ? arr(j)[i] : null, p = MODO === "eta" && j.eta_pct ? j.eta_pct[i] : null;
      return `<td ${p != null ? `style="background:${corNota(p)}22;color:${corNota(p)};font-weight:700"` : ""}>${fmtV(v, DEF[i].tipo)}</td>`; }).join("") + "</tr>").join("");
  document.querySelectorAll("#tabela th").forEach(th => th.onclick = () => { if (th.dataset.i != null) { const i = +th.dataset.i; ordem = { i, dir: ordem.i === i ? -ordem.dir : (DEF[i].menos_melhor ? 1 : -1), campo: null }; }
    else { const c = th.dataset.c; ordem = { i: null, dir: ordem.campo === c ? -ordem.dir : (c === "min" ? -1 : 1), campo: c }; } desenha(); });
  document.querySelectorAll("#tabela tbody tr").forEach(tr => tr.onclick = () => { const j = DADOS.find(x => x.id === tr.dataset.id); if (j) abrirFicha(j, MODO); });
}
iniciar();
</script>
</body>
</html>
